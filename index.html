<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Réseau de tâches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --panel: #1B1F26;
    --panel-raised: #232830;
    --line: #2C3038;
    --text: #E8E6E1;
    --text-dim: #8A8F98;
    --text-faint: #5B606A;
    --accent: #7C9885;
    --accent-soft: rgba(124,152,133,0.18);
    --danger: #B0655B;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
  }
  #app{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  .view{ flex:1; min-height:0; display:none; flex-direction:column; overflow:hidden; }
  .view.active{ display:flex; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 18px 20px 12px;
    display:flex; align-items:baseline; justify-content:space-between;
    flex-shrink:0;
  }
  .topbar h1{ font-size:19px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .topbar .sub{ font-size:13px; color:var(--text-dim); margin-top:2px; }

  /* ---------- Bottom nav ---------- */
  nav.tabs{
    display:flex; flex-shrink:0;
    border-top:1px solid var(--line);
    background: var(--panel);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint);
    padding:10px 4px 12px; font-family:inherit; font-size:11.5px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer;
  }
  nav.tabs button svg{ width:22px; height:22px; opacity:0.6; }
  nav.tabs button.active{ color:var(--text); }
  nav.tabs button.active svg{ opacity:1; }
  nav.tabs button .dot{
    width:4px;height:4px;border-radius:50%; background:var(--accent);
    opacity:0; margin-top:-2px;
  }
  nav.tabs button.active .dot{ opacity:1; }

  /* ---------- FAB ---------- */
  /* ---------- Barre de lieu ---------- */
  #location-bar{
    width:100%; background:var(--panel); border:none; border-top:1px solid var(--line);
    color:var(--text-dim); padding:9px 18px; font-family:inherit; font-size:12.5px;
    text-align:left; display:flex; align-items:center; gap:7px; cursor:pointer; flex-shrink:0;
  }
  #location-bar b{ color:var(--text); font-weight:500; }

  /* ---------- Calendrier ---------- */
  #calendar-view .content{ flex:1; overflow-y:auto; padding: 4px 16px 90px; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav button{ background:var(--panel); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:9px; font-size:16px; font-family:inherit; }
  .cal-month-label{ font-size:14.5px; font-weight:600; text-transform:capitalize; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:18px; }
  .cal-weekday{ text-align:center; font-size:10.5px; color:var(--text-faint); padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:10px; background:var(--panel); font-size:12.5px; color:var(--text-dim);
    border:1px solid transparent; font-family:inherit; padding:0;
  }
  .cal-cell.empty{ background:none; visibility:hidden; }
  .cal-cell.today{ border-color:var(--text-faint); color:var(--text); }
  .cal-cell.selected{ background:var(--accent-soft); border-color:var(--accent); color:var(--text); }
  .cal-cell .cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); margin-top:3px; }
  .cal-day-title{ font-size:13px; color:var(--text-dim); margin-bottom:8px; }

  /* ---------- Réglages du panneau lieu ---------- */
  .loc-chip{
    display:inline-flex; align-items:center; padding:9px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--text);
    font-size:13.5px; margin:0 6px 6px 0; cursor:pointer;
  }
  .loc-chip.selected{ background:var(--accent-soft); border-color:var(--accent); }

  .fab{
    position:absolute; right:18px;
    bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    width:52px; height:52px; border-radius:50%;
    background: var(--accent); color:#12160F;
    border:none; font-size:26px; font-weight:400;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    cursor:pointer; z-index:20;
  }

  /* ============ AUJOURD'HUI ============ */
  #today-list{ flex:1; overflow-y:auto; padding: 4px 16px 90px; }
  .today-summary{
    padding: 0 20px 14px; color:var(--text-dim); font-size:13px;
  }
  .task-row{
    display:flex; align-items:center; gap:12px;
    background:var(--panel); border-radius: var(--radius);
    padding:13px 14px; margin-bottom:8px;
  }
  .task-row.done{ opacity:0.45; }
  @keyframes rowPulse{ 0%{transform:scale(1);} 35%{transform:scale(1.025); background:var(--accent-soft);} 100%{transform:scale(1);} }
  .task-row.pulse{ animation: rowPulse 0.5s ease; }
  @keyframes confetti-fall{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    100%{ transform: translateY(115vh) rotate(360deg); opacity:0; }
  }
  @keyframes toast-pop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.85); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    82%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(0.96); }
  }
  .check{
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--text-faint); background:none;
    display:flex; align-items:center; justify-content:center;
  }
  .check.checked{ background:var(--accent); border-color:var(--accent); }
  .check svg{ width:12px; height:12px; display:none; }
  .check.checked svg{ display:block; }
  .task-main{ flex:1; min-width:0; }
  .task-title{ font-size:14.5px; font-weight:500; }
  .task-row.done .task-title{ text-decoration: line-through; }
  .task-meta{ font-size:12px; color:var(--text-dim); margin-top:2px; display:flex; gap:8px; align-items:center; }
  .cluster-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .unpin-btn{ background:none; border:none; color:var(--text-faint); font-size:18px; padding:4px 6px; cursor:pointer; }
  .empty-state{ text-align:center; padding: 60px 30px; color:var(--text-dim); font-size:14px; line-height:1.6; }

  /* ============ RÉSEAU ============ */
  #graph-wrap{ flex:1; position:relative; overflow:hidden; }
  #legend{
    position:absolute; top:12px; left:12px; right:12px; z-index:10;
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
  }
  .legend-chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    background: rgba(27,31,38,0.85); backdrop-filter: blur(6px);
    border:1px solid var(--line); border-radius:20px; padding:6px 12px 6px 8px;
    font-size:12px; color:var(--text-dim);
  }
  .legend-chip.off{ opacity:0.35; }
  .legend-chip .dot{ width:8px; height:8px; border-radius:50%; }
  svg#canvas{ width:100%; height:100%; touch-action:none; display:block; }
  .node-ring{ fill:none; stroke-width:2px; opacity:0.5; }
  .node-circle{ cursor:grab; }
  .node-label{ font-family:'Inter',sans-serif; font-size:11px; fill:var(--text); pointer-events:none; text-anchor:middle; }
  .link-line{ stroke:var(--text-faint); opacity:0.55; }

  /* ============ DÉCIDER ============ */
  #decide-view .content{ flex:1; overflow-y:auto; padding: 4px 20px 40px; }
  .field-label{ font-size:12.5px; color:var(--text-dim); margin: 18px 0 8px; }
  .pill-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    padding:9px 16px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel); color:var(--text-dim); font-size:13.5px;
    font-family:inherit; cursor:pointer;
  }
  .pill.selected{ background:var(--accent-soft); border-color:var(--accent); color:var(--text); }
  .decide-btn{
    width:100%; margin-top:26px; padding:15px; border-radius:var(--radius);
    background:var(--accent); color:#12160F; border:none; font-weight:600;
    font-size:15px; font-family:inherit; cursor:pointer;
  }
  .result-card{
    margin-top:24px; background:var(--panel-raised); border-radius:var(--radius);
    padding:22px 20px; border:1px solid var(--line);
  }
  .result-cluster{ font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .result-title{ font-size:19px; font-weight:600; line-height:1.35; }
  .result-meta{ margin-top:10px; font-size:13px; color:var(--text-dim); }
  .result-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-secondary{
    flex:1; padding:12px; border-radius:10px; background:none;
    border:1px solid var(--line); color:var(--text-dim); font-family:inherit;
    font-size:13.5px; cursor:pointer;
  }
  .btn-primary{
    flex:1; padding:12px; border-radius:10px; background:var(--accent);
    border:none; color:#12160F; font-family:inherit; font-weight:600;
    font-size:13.5px; cursor:pointer;
  }
  .decide-empty{ margin-top:24px; color:var(--text-dim); font-size:14px; line-height:1.6; }

  /* ============ MODAL ============ */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:30;
    display:none; align-items:flex-end;
  }
  #overlay.open{ display:flex; }
  #sheet{
    background: var(--panel); width:100%; max-height:88vh; overflow-y:auto;
    border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px; }
  .sheet-title{ font-size:17px; font-weight:600; margin-bottom:18px; }
  label{ display:block; font-size:12.5px; color:var(--text-dim); margin:16px 0 7px; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=number], input[type=date], select{
    width:100%; background:var(--panel-raised); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; color:var(--text); font-family:inherit;
    font-size:14.5px;
  }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .dep-list{ max-height:150px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .dep-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .dep-item:last-child{ border-bottom:none; }
  .dep-item input{ width:16px; height:16px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:24px; }
  .btn-delete{ background:none; border:1px solid var(--danger); color:var(--danger); border-radius:10px; padding:12px 16px; font-family:inherit; font-size:13.5px; }
  .btn-save{ flex:1; background:var(--accent); border:none; color:#12160F; border-radius:10px; padding:12px; font-family:inherit; font-weight:600; font-size:14px; }
  .btn-cancel{ background:none; border:1px solid var(--line); color:var(--text-dim); border-radius:10px; padding:12px 16px; font-family:inherit; font-size:13.5px; }

  /* node detail sheet extra */
  .detail-row{ display:flex; gap:10px; margin-top:14px; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="app">

  <!-- ===== AUJOURD'HUI ===== -->
  <div class="view active" id="today-view">
    <div class="topbar">
      <div>
        <h1>Aujourd'hui</h1>
        <div class="sub" id="today-date"></div>
      </div>

  <div class="view" id="graph-view">

        </button>
        <button id="settings-btn" aria-label="Réglages" style="background:none;border:none;color:var(--text-dim);padding:4px;cursor:pointer;">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2.5 12h3M18.5 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/></svg>

  <!-- ===== DÉCIDER ===== -->
  <div class="view" id="decide-view">
    <div class="topbar">
      <div><h1>Décider</h1><div class="sub">Réduis le choix au lieu de le regarder en entier</div></div>
    </div>
    <div class="content">
      <div class="field-label">Temps disponible</div>
      <div class="pill-group" id="time-pills"></div>
      <div class="field-label">Énergie du moment</div>

      <button class="decide-btn" id="decide-btn">Propose-moi quelque chose</button>

  <!-- ===== CALENDRIER ===== -->
  <div class="view" id="calendar-view">
    <div class="topbar"><div><h1>Calendrier</h1><div class="sub">Touche un jour pour voir ou déplacer ce qui y est prévu</div></div></div>
    <div class="content">
      <div class="cal-nav">
        <button id="cal-prev">‹</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button id="cal-next">›</button>
      </div>
      <div class="cal-grid" id="cal-weekdays">
        <div class="cal-weekday">L</div><div class="cal-weekday">M</div><div class="cal-weekday">M</div>
        <div class="cal-weekday">J</div><div class="cal-weekday">V</div><div class="cal-weekday">S</div><div class="cal-weekday">D</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>

  <!-- ===== FAB ===== -->

<!-- ===== MODAL SHEET ===== -->
<div id="overlay">

<script>
(function(){

// ---------------------------------------------------------------
// DATA
// ---------------------------------------------------------------
const CLUSTER_PALETTE = ['#C97B63','#6E8CA0','#B08BBB','#C9A227','#6FA08A','#B0655B','#7B8FC9','#A0956E'];
let data = { nodes: [], links: [], clusterColors: {} };
let loaded = false;

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// "35" -> 35 min · "1h30" -> 90 min · "1h" -> 60 min · "1.5h" ou "1,5h" -> 90 min
function parseDurationInput(str){
  if(!str) return null;
  str = str.trim().toLowerCase().replace(',', '.');
  if(!str) return null;
  let m = str.match(/^(\d+)h(\d{1,2})?$/);
  if(m) return parseInt(m[1])*60 + (m[2]?parseInt(m[2]):0);
  m = str.match(/^(\d+(\.\d+)?)h$/);
  if(m) return Math.round(parseFloat(m[1])*60);
  m = str.match(/^\d+$/);
  if(m) return parseInt(str);
  return null;
}
// minutes -> "35 min" ou "1h30" pour affichage
function formatDuration(min){
  if(!min) return '';
  if(min < 60) return min+' min';
  const h = Math.floor(min/60), r = min%60;
  return r ? `${h}h${String(r).padStart(2,'0')}` : `${h}h`;
}
// minutes -> valeur à remettre dans le champ texte en édition
function formatDurationForInput(min){
  if(!min) return '';
  if(min < 60) return String(min);
  const h = Math.floor(min/60), r = min%60;
  return r ? `${h}h${String(r).padStart(2,'0')}` : `${h}h`;
}

function colorForCluster(name){
  if(!data.clusterColors[name]){
    const used = Object.values(data.clusterColors);
    const next = CLUSTER_PALETTE.find(c=>!used.includes(c)) || CLUSTER_PALETTE[Object.keys(data.clusterColors).length % CLUSTER_PALETTE.length];
    data.clusterColors[name] = next;
  }
  return data.clusterColors[name];
}

// Stockage portable : l'API window.storage n'existe que dans les artifacts Claude.
// Une fois le fichier hébergé ailleurs (GitHub Pages, etc.) et ouvert dans un navigateur normal,
// elle n'existe plus — on bascule alors automatiquement sur localStorage, qui lui fonctionne
// dans n'importe quelle page web classique et garde les données sur l'appareil.
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasClaudeStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? {key, value: raw} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return {key, value}; }catch(e){ return null; }
}

async function loadData(){
  try{
    const res = await storageGet('reseau-taches-data');
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      data = Object.assign({nodes:[],links:[],clusterColors:{}}, parsed);
    }
  }catch(e){ /* pas encore de données */ }
  loaded = true;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await storageSet('reseau-taches-data', JSON.stringify(data)); }
    catch(e){ console.error('Sauvegarde impossible', e); }
    pushToDrive();
  }, 250);
}

// ---------------------------------------------------------------
// SYNCHRONISATION GOOGLE DRIVE (pour le widget)
// ---------------------------------------------------------------
// Colle ici ton Client ID et ta clé API une fois créés dans Google Cloud Console

function driveConfigured(){

function buildMultipartBody(meta, content){
  const boundary = 'foo_bar_baz_reseau_taches';
  return `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
}

async function ensureDriveFile(){
  if(driveFileId) return driveFileId;
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers:{ Authorization:`Bearer ${driveToken}` }
  });
  const listData = await listRes.json();
  if(listData.files && listData.files.length){
    driveFileId = listData.files[0].id;
  }else{
    const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST',
      headers:{ Authorization:`Bearer ${driveToken}`, 'Content-Type':'multipart/related; boundary=foo_bar_baz_reseau_taches' },
      body: buildMultipartBody({name:DRIVE_FILE_NAME, mimeType:'application/json'}, JSON.stringify(data))
    });
    const createData = await createRes.json();
    driveFileId = createData.id;
    // rend UNIQUEMENT ce fichier lisible par lien — pas le reste du Drive
    await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}/permissions`, {
      method:'POST',
      headers:{ Authorization:`Bearer ${driveToken}`, 'Content-Type':'application/json' },
      body: JSON.stringify({role:'reader', type:'anyone'})
    });
  }
  try{ localStorage.setItem('drive-file-id', driveFileId); }catch(e){}
  return driveFileId;
}

function connectDrive(onDone){
  if(!driveConfigured()){
    alert("Ajoute d'abord ton Client ID et ta clé API Google en haut du fichier (voir les instructions).");
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: async (resp)=>{
      if(resp.error){ alert('Connexion Google refusée ou annulée.'); return; }
      driveToken = resp.access_token;
      driveConnected = true;
      try{
        await ensureDriveFile();
        await pushToDrive(true);
      }catch(e){ alert("La connexion a marché mais la synchronisation a échoué. Réessaie."); }
      if(onDone) onDone();
    }
  });
  client.requestAccessToken();
}

async function pushToDrive(force){
  if(!driveConnected || !driveToken || !driveFileId) return;
  if(driveSyncing && !force) return;
  driveSyncing = true;
  try{
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:'PATCH',
      headers:{ Authorization:`Bearer ${driveToken}`, 'Content-Type':'application/json' },
      body: JSON.stringify(data)
    });
  }catch(e){ console.error('Sync Drive impossible', e); }
  driveSyncing = false;
}

function widgetUrl(){
  if(!driveFileId) return null;
  const base = location.href.replace(/index\.html.*$/,'').replace(/\/[^\/]*$/,'/');
  return `${base}widget.html?id=${driveFileId}&key=${encodeURIComponent(GOOGLE_API_KEY)}`;
}

// unlocked = pas fait, et tous les prérequis (liens entrants) sont faits
function isUnlocked(node){
  if(node.status === 'done') return false;
  const prereqs = data.links.filter(l=>l.to===node.id).map(l=>data.nodes.find(n=>n.id===l.from));
  return prereqs.every(p=>p && p.status==='done');
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}
function playTone(freq, start, duration, ctx, type, gainPeak){
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainPeak||0.16, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function playChime(){
  const ctx = getAudioCtx(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();
  playTone(880, 0, 0.16, ctx);
  playTone(1318.5, 0.06, 0.2, ctx);
}
function playFanfare(){
  const ctx = getAudioCtx(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();
  [523.25,659.25,783.99,1046.5].forEach((f,i)=> playTone(f, i*0.09, 0.35, ctx, 'triangle', 0.15));
}
function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function celebrateSmall(rowEl){
  playChime();
  vibrate(25);
  if(rowEl){ rowEl.classList.remove('pulse'); void rowEl.offsetWidth; rowEl.classList.add('pulse'); }
}
function spawnConfetti(){
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
  document.body.appendChild(layer);
  const emojis = ['🎉','✨','🎊','⭐'];
  for(let i=0;i<28;i++){
    const span = document.createElement('span');
    span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const left = Math.random()*100, size = 16+Math.random()*18;
    const duration = 1.7+Math.random()*1.2, delay = Math.random()*0.45, rot = Math.floor(Math.random()*360);
    span.style.cssText = `position:absolute;left:${left}%;top:-8%;font-size:${size}px;
      animation: confetti-fall ${duration}s ease-in ${delay}s forwards;
      transform: rotate(${rot}deg);`;
    layer.appendChild(span);
  }
  setTimeout(()=>layer.remove(), 3300);
}
function showToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);
    background:var(--panel-raised);border:1px solid var(--line);color:var(--text);
    padding:14px 22px;border-radius:14px;font-size:15px;font-weight:600;text-align:center;
    z-index:10000;opacity:0;animation: toast-pop 2.6s ease forwards;pointer-events:none;max-width:80vw;`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2700);
}

// RÉSEAU — simulation simple
// ---------------------------------------------------------------
const svg = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';
let simRunning = false, rafId = null, quietFrames = 0;
let dragNode = null, dragOffset = {x:0,y:0};
let clusterOff = {};
let hideDone = false;
let frozen = false;
const FORCE_DEFAULTS = { nodeSize:1, linkWidth:1.4, centerForce:0.0009, repelForce:3200, linkForce:0.02, linkDistance:100, siblingSpacing:60 };
let forceConfig = Object.assign({}, FORCE_DEFAULTS);

function ensurePositions(){
  const rect = document.getElementById('graph-wrap').getBoundingClientRect();
  const w = rect.width||360, h = rect.height||500;
  data.nodes.forEach(n=>{
    if(typeof n.x !== 'number'){ n.x = w/2 + (Math.random()-0.5)*w*0.6; n.y = h/2 + (Math.random()-0.5)*h*0.6; }
    n.vx = n.vx||0; n.vy = n.vy||0;
  });
}

function radiusFor(n){
  const base = 22;
  const extra = Math.min(16, (n.duration||20)/8);
  return (base + extra) * forceConfig.nodeSize;
}

function simStep(w,h){
  const nodes = data.nodes;
  // répulsion
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let dist = Math.sqrt(dx*dx+dy*dy)||0.1;
      const minDist = radiusFor(a)+radiusFor(b)+26;
      const force = Math.min(700, forceConfig.repelForce/(dist*dist));
      if(dist < minDist*2.2){
        const fx = (dx/dist)*force, fy=(dy/dist)*force;
        a.vx += fx*0.02; a.vy += fy*0.02;
        b.vx -= fx*0.02; b.vy -= fy*0.02;
      }
    }
  }
  // liens (ressort)
  data.links.forEach(l=>{
    const a = nodes.find(n=>n.id===l.from), b = nodes.find(n=>n.id===l.to);
    if(!a||!b) return;
    let dx=b.x-a.x, dy=b.y-a.y;
    let dist = Math.sqrt(dx*dx+dy*dy)||0.1;
    const f = (dist-forceConfig.linkDistance)*forceConfig.linkForce;
    const fx=(dx/dist)*f, fy=(dy/dist)*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  // écartement des tâches "sœurs" : deux tâches qui partagent un voisin commun
  // (même parent) mais ne sont pas reliées entre elles doivent rester espacées,
  // même si les autres réglages de forces sont doux
  const neighborMap = {};
  data.links.forEach(l=>{
    (neighborMap[l.from] = neighborMap[l.from]||new Set()).add(l.to);
    (neighborMap[l.to] = neighborMap[l.to]||new Set()).add(l.from);
  });
  if(forceConfig.siblingSpacing > 0){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        const na = neighborMap[a.id], nb = neighborMap[b.id];
        if(!na || !nb || na.has(b.id)) continue; // pas de voisins, ou déjà liées directement
        let shared = 0;
        na.forEach(id=>{ if(nb.has(id)) shared++; });
        if(shared===0) continue;
        let dx=a.x-b.x, dy=a.y-b.y;
        let dist = Math.sqrt(dx*dx+dy*dy)||0.1;
        const target = radiusFor(a)+radiusFor(b)+forceConfig.siblingSpacing;
        if(dist < target){
          const f = (target-dist)*0.035*Math.min(shared,3);
          const fx=(dx/dist)*f, fy=(dy/dist)*f;
          a.vx += fx; a.vy += fy;
          b.vx -= fx; b.vy -= fy;
        }
      }
    }
  }
  // cohésion de domaine
  const groups = {};
  nodes.forEach(n=>{ (groups[n.cluster]=groups[n.cluster]||[]).push(n); });
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    let cx=0,cy=0; g.forEach(n=>{cx+=n.x;cy+=n.y;}); cx/=g.length; cy/=g.length;
    g.forEach(n=>{
      n.vx += (cx-n.x)*0.006;
      n.vy += (cy-n.y)*0.006;
    });
  });
  // force centrale + intégration
  let totalSpeed = 0;
  nodes.forEach(n=>{
    if(n===dragNode) return;
    n.vx += (w/2-n.x)*forceConfig.centerForce;
    n.vy += (h/2-n.y)*forceConfig.centerForce;
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx; n.y += n.vy;
    totalSpeed += Math.abs(n.vx)+Math.abs(n.vy);
  });
  // résolution de collision — garantit qu'aucune bulle ne chevauche une autre,
  // quels que soient les réglages de forces au-dessus (liées, même domaine, ou non)
  for(let iter=0; iter<3; iter++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let dist = Math.sqrt(dx*dx+dy*dy)||0.01;
        const minDist = radiusFor(a)+radiusFor(b)+8;
        if(dist < minDist){
          const push = (minDist-dist)/2;
          const nx=dx/dist, ny=dy/dist;
          if(a!==dragNode){ a.x -= nx*push; a.y -= ny*push; }
          if(b!==dragNode){ b.x += nx*push; b.y += ny*push; }
        }
      }
    }
  }
  nodes.forEach(n=>{
    if(n===dragNode) return;
    const r = radiusFor(n);
    n.x = Math.max(r, Math.min(w-r, n.x));
    n.y = Math.max(r+10, Math.min(h-r, n.y));
  });
  return totalSpeed;
}

function renderGraph(){
  const rect = document.getElementById('graph-wrap').getBoundingClientRect();
  const w = rect.width||360, h = rect.height||500;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const showOther = showOtherLocations();
  const visible = data.nodes.filter(n => {
    if(clusterOff[n.cluster] === true) return false;
    if(hideDone && n.status==='done') return false;
    if(!taskAtCurrentLocation(n) && !showOther) return false;
    return true;
  });
  const visibleIds = new Set(visible.map(n=>n.id));
  const visLinks = data.links.filter(l=>visibleIds.has(l.from)&&visibleIds.has(l.to));

  let html = '';
  visLinks.forEach(l=>{
    const a=data.nodes.find(n=>n.id===l.from), b=data.nodes.find(n=>n.id===l.to);
    if(!a||!b) return;
    html += `<line class="link-line" style="stroke-width:${forceConfig.linkWidth}px" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  });
  visible.forEach(n=>{
    const r = radiusFor(n);
    const color = colorForCluster(n.cluster);
    const done = n.status==='done';
    const unlocked = isUnlocked(n);
    const awayLoc = !taskAtCurrentLocation(n);
    html += `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})">`;
    if(unlocked && !done && !awayLoc){
      html += `<circle class="node-ring" r="${r+5}" stroke="${color}"/>`;
    }
    const fill = done ? '#2C3038' : color;
    const fillOpacity = done ? 1 : (awayLoc ? 0.32 : 0.85);
    html += `<circle class="node-circle" r="${r}" fill="${fill}" fill-opacity="${fillOpacity}" stroke="${done?'#5B606A':(awayLoc?'#5B606A':'none')}" stroke-dasharray="${awayLoc&&!done?'3,3':'none'}" stroke-width="1.5"/>`;
    const label = n.title.length>14 ? n.title.slice(0,13)+'…' : n.title;
    html += `<text class="node-label" y="${r+15}" fill="${done||awayLoc?'var(--text-faint)':'var(--text)'}">${escapeHtml(label)}</text>`;
    html += `</g>`;
  });
  svg.innerHTML = html;
}

function loopTick(){
  if(!simRunning) return;
  const rect = document.getElementById('graph-wrap').getBoundingClientRect();
  const totalSpeed = simStep(rect.width||360, rect.height||500);
  renderGraph();
  if(dragNode){ quietFrames = 0; }
  else if(totalSpeed < 0.6){ quietFrames++; } else { quietFrames = 0; }
  if(quietFrames > 45){ simRunning = false; return; } // stabilisé : on arrête de redessiner pour laisser le tap tranquille
  rafId = requestAnimationFrame(loopTick);
}
function startSim(){
  ensurePositions();
  quietFrames = 0;
  if(frozen){ renderGraph(); return; }
  if(simRunning) return;
  simRunning = true;
  loopTick();
}
function wakeSim(){
  if(frozen) return;
  quietFrames = 0;
  if(!simRunning){ simRunning = true; loopTick(); }
}
function stopSim(){ simRunning=false; if(rafId) cancelAnimationFrame(rafId); }

function svgPoint(evt){
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = (evt.clientX-rect.left) * (vb.width/rect.width);
  const y = (evt.clientY-rect.top) * (vb.height/rect.height);
  return {x,y};
}
let didDrag = false;
let pointerStart = {x:0,y:0};
let dragPointerId = null;
const DRAG_THRESHOLD = 7; // px en coordonnées écran, avant de considérer que c'est un glisser

function onNodeDown(evt){
  const g = evt.target.closest('.node');
  if(!g) return;
  evt.preventDefault();
  const id = g.dataset.id;
  const n = data.nodes.find(x=>x.id===id);
  if(!n) return;
  dragNode = n; didDrag = false;
  pointerStart = {x:evt.clientX, y:evt.clientY};
  dragPointerId = evt.pointerId;
  try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
  wakeSim();
  window.addEventListener('pointermove', onNodeMove);
  window.addEventListener('pointerup', onNodeUp);
  window.addEventListener('pointercancel', onNodeUp);
}
function onNodeMove(evt){
  if(!dragNode) return;
  const moved = Math.hypot(evt.clientX-pointerStart.x, evt.clientY-pointerStart.y);
  if(!didDrag){
    if(moved < DRAG_THRESHOLD) return; // simple jitter tactile, pas un vrai glisser
    didDrag = true;
    const p0 = svgPoint(evt);
    dragOffset = {x:p0.x-dragNode.x, y:p0.y-dragNode.y};
  }
  const p = svgPoint(evt);
  dragNode.x = p.x-dragOffset.x; dragNode.y = p.y-dragOffset.y;
  dragNode.vx = 0; dragNode.vy = 0;
  if(!simRunning) renderGraph(); // la boucle est peut-être arrêtée (stabilisée ou gelée) : on redessine quand même pendant le glisser
}
function onNodeUp(evt){
  window.removeEventListener('pointermove', onNodeMove);
  window.removeEventListener('pointerup', onNodeUp);
  window.removeEventListener('pointercancel', onNodeUp);
  try{ svg.releasePointerCapture(dragPointerId); }catch(e){}
  if(dragNode && !didDrag){ openDetail(dragNode.id); }
  if(dragNode) save();
  dragNode = null;
}
svg.addEventListener('pointerdown', onNodeDown);

function renderLegend(){
  const clusters = [...new Set(data.nodes.map(n=>n.cluster))];
  const legend = document.getElementById('legend');
  legend.innerHTML = `<div class="legend-chip ${hideDone?'':'off'}" id="hide-done-chip" style="border-color:var(--text-faint)">
      <span class="dot" style="background:${hideDone?'var(--accent)':'var(--text-faint)'}"></span>Terminées
    </div>` + clusters.map(c=>{
    const off = clusterOff[c]===true;
    return `<div class="legend-chip ${off?'off':''}" data-cluster="${escapeAttr(c)}">
      <span class="dot" style="background:${colorForCluster(c)}"></span>${escapeHtml(c)}
    </div>`;
  }).join('');
  legend.querySelectorAll('.legend-chip[data-cluster]').forEach(chip=>{
    let pressTimer = null, longFired = false;
    chip.addEventListener('pointerdown', ()=>{
      longFired = false;
      pressTimer = setTimeout(()=>{
        longFired = true;
        soloCluster(chip.dataset.cluster);
      }, 480);
    });
    const cancelPress = ()=>{ clearTimeout(pressTimer); };
    chip.addEventListener('pointerup', ()=>{
      cancelPress();
      if(longFired) return;
      const c = chip.dataset.cluster;
      clusterOff[c] = !clusterOff[c];
      renderLegend(); renderGraph();
    });
    chip.addEventListener('pointerleave', cancelPress);
    chip.addEventListener('pointercancel', cancelPress);
  });
  const hideChip = document.getElementById('hide-done-chip');
  if(hideChip){
    hideChip.addEventListener('click', ()=>{
      hideDone = !hideDone;
      renderLegend(); renderGraph();
    });
  }
}
function soloCluster(target){
  const clusters = [...new Set(data.nodes.map(n=>n.cluster))];
  const isAlreadySolo = clusters.every(c => c===target ? clusterOff[c]!==true : clusterOff[c]===true);
  if(isAlreadySolo){
    clusterOff = {}; // long-appui de nouveau -> tout réafficher
  }else{
    clusterOff = {};
    clusters.forEach(c=>{ if(c!==target) clusterOff[c] = true; });
  }
  renderLegend(); renderGraph();
}

function openEditForm(existing){

    return (a.cluster||'').localeCompare(b.cluster||'') || a.title.localeCompare(b.title);

    <div class="sheet-title">${isNew?'Nouvelle tâche':'Modifier la tâche'}</div>

      <div>
        <label>Durée estimée</label>
        <input type="text" id="f-duration" value="${formatDurationForInput(node.duration)}" placeholder="35 ou 1h30" inputmode="text">

      </div>
      <div>
        <label>Énergie requise</label>
        <select id="f-energy">
          <option value="low" ${node.energy==='low'?'selected':''}>Basse</option>
          <option value="medium" ${node.energy==='medium'?'selected':''}>Moyenne</option>
          <option value="high" ${node.energy==='high'?'selected':''}>Haute</option>
        </select>
      </div>
    </div>
    <label>Échéance (optionnel)</label>
    <input type="date" id="f-deadline" value="${node.deadline||''}">
    <label>Lieu <span style="font-weight:400;color:var(--text-faint);">(optionnel — vide = peu importe où)</span></label>
    <input type="text" id="f-location" list="location-list" value="${escapeAttr(node.location||'')}" placeholder="Ex : Chez mon père">

    <div style="display:flex;gap:8px;">
      <input type="date" id="f-pindate" value="${node.pinnedDate||''}" style="flex:1;">
      <button type="button" class="btn-secondary" id="f-pin-today" style="flex-shrink:0;">Aujourd'hui</button>
    </div>
    ${others.length? `<label>Dépend de <span style="font-weight:400;color:var(--text-faint);">(à faire avant celle-ci)</span></label>
    <div class="dep-list">${depListHtml('dep', currentDeps)}</div>
    <label>Nécessaire pour <span style="font-weight:400;color:var(--text-faint);">(celle-ci doit être faite avant)</span></label>
    <div class="dep-list">${depListHtml('reqfor', currentRequiredFor)}</div>
    ` : ''}
    <div class="sheet-actions">
      ${!isNew? `<button class="btn-delete" id="f-delete">Supprimer</button>`:''}

  others.forEach(o=>{
    const depCb = sheet.querySelector(`[data-dep="${o.id}"]`);
    const reqCb = sheet.querySelector(`[data-reqfor="${o.id}"]`);
    if(!depCb || !reqCb) return;
    reqCb.disabled = depCb.checked;
    depCb.disabled = reqCb.checked;
    depCb.addEventListener('change', ()=>{ reqCb.disabled = depCb.checked; });
    reqCb.addEventListener('change', ()=>{ depCb.disabled = reqCb.checked; });

      data.links.push({from: node.id, to: cb.dataset.reqfor});
    });
    save(); closeSheet(); refreshAll(); refreshCalendarView();
  });

function renderPills(){
  document.getElementById('time-pills').innerHTML = timeOptions.map(o=>
    `<button class="pill ${selTime===o.v?'selected':''}" data-time="${o.v}">${o.l}</button>`).join('');
  document.getElementById('energy-pills').innerHTML = energyOptions.map(o=>
    `<button class="pill ${selEnergy===o.v?'selected':''}" data-energy="${o.v}">${o.l}</button>`).join('');
  document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click', ()=>{ selTime=parseInt(b.dataset.time); renderPills(); }));
  document.querySelectorAll('[data-energy]').forEach(b=>b.addEventListener('click', ()=>{ selEnergy=b.dataset.energy; renderPills(); }));
}
const energyRank = {low:1, medium:2, high:3};
let lastSuggestionId = null;

function candidatesFiltered(){
  return data.nodes.filter(n=>{
    if(!isUnlocked(n)) return false;
    if(!taskAtCurrentLocation(n)) return false;
    if(n.duration && n.duration > selTime) return false;
    if(energyRank[n.energy||'medium'] > energyRank[selEnergy]) return false;
    return true;
  }).sort((a,b)=>{
    const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
    const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
    return da-db;
  });
}
function candidatesRandom(){
  return data.nodes.filter(n=>isUnlocked(n) && taskAtCurrentLocation(n));
}

function renderResult(candidates, regenerate, emptyMsg){
  const resultDiv = document.getElementById('decide-result');
  if(!candidates.length){
    resultDiv.innerHTML = `<div class="decide-empty">${emptyMsg}</div>`;
    return;
  }
  const pool = candidates.filter(c=>c.id!==lastSuggestionId);
  const pick = (pool.length? pool : candidates)[Math.floor(Math.random()*(pool.length?pool.length:candidates.length))];
  lastSuggestionId = pick.id;
  const color = colorForCluster(pick.cluster);
  resultDiv.innerHTML = `
    <div class="result-card">
      <div class="result-cluster" style="color:${color}">${escapeHtml(pick.cluster)}</div>
      <div class="result-title">${escapeHtml(pick.title)}</div>
      <div class="result-meta">${pick.duration? formatDuration(pick.duration)+' · ':''}énergie ${energyOptions.find(e=>e.v===(pick.energy||'medium')).l.toLowerCase()}${pick.deadline? ' · échéance '+new Date(pick.deadline).toLocaleDateString('fr-FR'):''}</div>
      <div class="result-actions">
        <button class="btn-secondary" id="r-other">Autre idée</button>
        <button class="btn-primary" id="r-go">Je fais ça</button>
      </div>
    </div>
  `;
  document.getElementById('r-other').addEventListener('click', regenerate);
  document.getElementById('r-go').addEventListener('click', ()=>{
    pick.pinnedDate = todayISO();
    save();
    resultDiv.innerHTML += `<div style="margin-top:10px;font-size:13px;color:var(--text-dim)">Épinglé à aujourd'hui.</div>`;
  });
}
function suggest(){
  renderResult(candidatesFiltered(), suggest, "Rien ne correspond à ces critères pour l'instant. Élargis le temps ou l'énergie, ou ajoute des tâches dans le Réseau.");
}
function suggestRandom(){
  renderResult(candidatesRandom(), suggestRandom, "Aucune tâche débloquée pour l'instant (une tâche est débloquée quand tout ce dont elle dépend est fait).");
}
document.getElementById('decide-btn').addEventListener('click', suggest);
document.getElementById('decide-random-btn').addEventListener('click', suggestRandom);

function attemptSilentDriveReauth(retries){
  retries = retries===undefined ? 10 : retries;
  if(!driveFileId || !driveConfigured()) return;
  if(typeof google==='undefined' || !google.accounts || !google.accounts.oauth2){
    if(retries>0) setTimeout(()=>attemptSilentDriveReauth(retries-1), 300);
    return;
  }
  try{
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp)=>{
        if(resp && resp.access_token){ driveToken = resp.access_token; driveConnected = true; }
      }
    });
    client.requestAccessToken({prompt:'none'});
  }catch(e){ /* la reconnexion manuelle restera nécessaire */ }
}

// ---------------------------------------------------------------
// CALENDRIER
// ---------------------------------------------------------------
let calViewDate = new Date();
let selectedCalDate = todayISO();

function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

function refreshCalendarView(){
  if(document.getElementById('calendar-view').classList.contains('active')){
    renderCalendar(); renderCalDayList();
  }
}

function renderCalendar(){
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  document.getElementById('cal-month-label').textContent = calViewDate.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const grid = document.getElementById('cal-grid');
  const firstDay = new Date(y, m, 1);
  const startOffset = (firstDay.getDay()+6)%7; // 0 = lundi
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayISO();

  // compte les tâches épinglées par jour pour ce mois
  const counts = {};
  data.nodes.forEach(n=>{ if(n.pinnedDate) counts[n.pinnedDate] = (counts[n.pinnedDate]||0)+1; });

  let html = '';
  for(let i=0;i<startOffset;i++) html += `<button class="cal-cell empty"></button>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = isoOf(y,m,d);
    const classes = ['cal-cell'];
    if(iso===today) classes.push('today');
    if(iso===selectedCalDate) classes.push('selected');
    html += `<button class="${classes.join(' ')}" data-date="${iso}">${d}${counts[iso]? `<span class="cal-dot"></span>`:''}</button>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedCalDate = cell.dataset.date;
      renderCalendar(); renderCalDayList();
    });
  });
}

function renderCalDayList(){
  const title = document.getElementById('cal-day-title');
  const list = document.getElementById('cal-day-list');
  const d = new Date(selectedCalDate+'T00:00:00');
  title.textContent = d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  const items = data.nodes.filter(n=>n.pinnedDate===selectedCalDate);
  if(!items.length){
    list.innerHTML = `<div class="empty-state">Rien de prévu ce jour-là.</div>`;
    return;
  }
  items.sort((a,b)=> (a.status==='done')-(b.status==='done'));
  list.innerHTML = items.map(n=>{
    const color = colorForCluster(n.cluster);
    return `<div class="task-row ${n.status==='done'?'done':''}" data-id="${n.id}">
      <button class="check ${n.status==='done'?'checked':''}" data-action="cal-toggle" data-id="${n.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#12160F" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
      </button>
      <div class="task-main" data-action="cal-open" data-id="${n.id}">
        <div class="task-title">${escapeHtml(n.title)}</div>
        <div class="task-meta">
          <span class="cluster-dot" style="background:${color}"></span>
          <span>${escapeHtml(n.cluster)}</span>
          ${n.duration? `<span>· ${formatDuration(n.duration)}</span>`:''}
        </div>
      </div>
      <button class="unpin-btn" data-action="cal-unpin" data-id="${n.id}">×</button>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-action=cal-toggle]').forEach(b=>b.addEventListener('click', ()=>{
    const n = data.nodes.find(x=>x.id===b.dataset.id);
    const becomingDone = n.status !== 'done';
    n.status = becomingDone ? 'done' : 'todo';
    n.completedDate = becomingDone ? todayISO() : null;
    save();
    if(becomingDone){
      celebrateSmall(b.closest('.task-row'));
      setTimeout(()=>{ renderCalDayList(); checkAllDoneToday(); }, 600);
    }else{
      renderCalDayList();
    }
  }));
  list.querySelectorAll('[data-action=cal-open]').forEach(el=>el.addEventListener('click', ()=>openDetail(el.dataset.id)));
  list.querySelectorAll('[data-action=cal-unpin]').forEach(b=>b.addEventListener('click', ()=>{
    const n = data.nodes.find(x=>x.id===b.dataset.id);
    n.pinnedDate = null;
    save(); renderCalendar(); renderCalDayList();
  }));
}
document.getElementById('cal-prev').addEventListener('click', ()=>{
  calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth()+1, 1);
  renderCalendar();
});

(async function init(){
  await loadData();
  if(data.settings){
    if(data.settings.forceConfig) forceConfig = Object.assign({}, FORCE_DEFAULTS, data.settings.forceConfig);
    frozen = !!data.settings.frozen;
  }
  applyFreezeVisual();
  updateLocationBar();
  renderPills();
  refreshAll();
  attemptSilentDriveReauth();
})();

})();
